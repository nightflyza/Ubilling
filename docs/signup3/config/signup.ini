;signup3 service language (english, ukrainian)
lang=ukrainian

;Ubilling instance URL
API_URL="http://127.0.0.1/billing/"
;Ubilling serial for RemoteAPI interaction
API_KEY="UB000000000000000000000000000000000"

;Salt mixed into daily JS-proof token
TOKEN_SALT="changeme!"

;local cache timeout for remote config JSON in seconds
;used only when "Database connections caching" is enabled in sigreq settings
cachetimeout=3600

;max signup requests per minute (0 disables the limit)
burstlimit=60

;debug mode
debug=0
