; PUMB (FUIB) OpenPayz frontend configuration
; Protocol: JSON + detached JWS (x-jws-signature)

; Service code registered at the bank for this merchant
SERVICE_CODE="7"

; Default receiver subdivision (agent) code when MULTI_MODE=0
; Sent as receiver_info.subdivision_code on /check
DEFAULT_SUBDIVISION_CODE="1"

; Future multi-contragent mode:
; 0 = always use DEFAULT_SUBDIVISION_CODE
; 1 = resolve subdivision_code from subscriber Ubilling agent (+ agentcodes_mapping.ini)
MULTI_MODE=0

; Agent codes mapping (used only when MULTI_MODE=1)
; Maps Ubilling agent ID => subdivision_code returned to the bank
USE_AGENTCODES=0
DISABLE_AGENTCODES_MAPPING_FILE=0
NON_STRICT_AGENTCODES=1
DEFAULT_AGENT_CODE=1

; Crypto keys (PEM). Exchange public keys with the bank.
; Facility = your gateway; Bank = PS (PUMB) public key for request verification
FACILITY_PRIVATE_KEY="keys/facility_priv_key.pem"
FACILITY_PUBLIC_KEY="keys/facility_pub_key.pem"
BANK_PUBLIC_KEY="keys/fuib_pub_key.pem"

; JWS algorithm for OUR responses (bank may use another for requests)
; Supported: RS256, RS384, RS512 (recommended). ES* needs JOSE raw r||s conversion.
JWS_ALGORITHM="RS256"

; Verify incoming JWS signatures (disable only for local debug without keys)
VERIFY_SIGNATURE=1

; Sign outgoing responses (disable only for local debug)
SIGN_RESPONSE=1

; REC_AMOUNT restriction: NONE or EQ
AMOUNT_RESTRICTION="NONE"

; Balance decimals in DEBT field (-1 = as is)
SUBSCRIBER_BALANCE_DECIMALS=-1

; Show city in address
CITY_DISPLAY_IN_ADDRESS=0

; Ubilling RemoteAPI (needed for MULTI_MODE agent lookup)
UBAPI_KEY="UBxxxxxxxxxxxxxxxx"
UBAPI_URL="http://localhost/billing/"

; Debug logging into processing_debug.log
DEBUG_MODE_ON=0
